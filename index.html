<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Layout (Inline CSS)</title>
    <!-- Font -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        /* Global resets and pseudo-elements that cannot be inline */
        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0;
        }
        
        /* Custom scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* Hide default details marker */
        details > summary {
            list-style: none;
        }
        details > summary::-webkit-details-marker {
            display: none;
        }

        /* Input Placeholder styling (cannot be done inline) */
        input::placeholder, textarea::placeholder {
            color: rgba(147, 197, 253, 0.5); /* blue-300/50 */
        }

        /* Hover effect for details icon rotation */
        details[open] summary svg {
            transform: rotate(180deg);
        }
    </style>
</head>
<body style="background-color: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; overflow-x: auto;">

    <!-- 
      MAIN CONTAINER 
      Equivalent to: w-full max-w-6xl flex flex-row gap-6 items-stretch min-w-[768px]
    -->
    <div style="width: 100%; max-width: 72rem; display: flex; flex-direction: row; gap: 1.5rem; align-items: stretch; min-width: 768px;">

        <!-- === LEFT GROUP (Dropdown + Cards) === -->
        <div style="width: 50%; display: flex; flex-direction: column; gap: 1.5rem;">
            
            <!-- 1. Dropdown Menu (Using <details>) -->
            <details style="position: relative; z-index: 20;">
                <summary style="width: 100%; box-sizing: border-box; background-color: white; border: 1px solid #e2e8f0; padding: 1rem; border-radius: 0.5rem; box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); display: flex; justify-content: space-between; align-items: center; cursor: pointer; outline: none; transition: background-color 0.2s;">
                    <span style="font-weight: 600; color: #334155;">Options</span>
                    <!-- Icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="transition: transform 0.2s;">
                        <path d="m6 9 6 6 6-6"/>
                    </svg>
                </summary>

                <!-- Dropdown Content -->
                <div style="position: absolute; top: 100%; margin-top: 0.5rem; width: 100%; background-color: white; border: 1px solid #f1f5f9; border-radius: 0.5rem; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04); overflow: hidden; z-index: 30;">
                    <a href="#" style="display: block; padding: 0.75rem; text-decoration: none; color: #475569; transition: background-color 0.2s, color 0.2s;" onmouseover="this.style.backgroundColor='#eff6ff'; this.style.color='#2563eb'" onmouseout="this.style.backgroundColor='transparent'; this.style.color='#475569'">General Inquiry</a>
                    <a href="#" style="display: block; padding: 0.75rem; text-decoration: none; color: #475569; transition: background-color 0.2s, color 0.2s;" onmouseover="this.style.backgroundColor='#eff6ff'; this.style.color='#2563eb'" onmouseout="this.style.backgroundColor='transparent'; this.style.color='#475569'">Support</a>
                    <a href="#" style="display: block; padding: 0.75rem; text-decoration: none; color: #475569; transition: background-color 0.2s, color 0.2s;" onmouseover="this.style.backgroundColor='#eff6ff'; this.style.color='#2563eb'" onmouseout="this.style.backgroundColor='transparent'; this.style.color='#475569'">Sales</a>
                    <a href="#" style="display: block; padding: 0.75rem; text-decoration: none; color: #475569; transition: background-color 0.2s, color 0.2s;" onmouseover="this.style.backgroundColor='#eff6ff'; this.style.color='#2563eb'" onmouseout="this.style.backgroundColor='transparent'; this.style.color='#475569'">Partnership</a>
                </div>
            </details>

            <!-- 2. Cards Container -->
            <div style="flex: 1 1 0%; display: flex; flex-direction: row; gap: 1rem;">
                
                <!-- Card 1 -->
                <div style="flex: 1 1 0%; display: flex; flex-direction: column; align-items: center; padding: 1rem; border-radius: 0.75rem; box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); border: 1px solid rgba(0,0,0,0.05); background-color: #f43f5e; transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.02)'" onmouseout="this.style.transform='scale(1)'">
                    <div style="background-color: rgba(255,255,255,0.2); padding: 0.75rem; border-radius: 9999px; margin-bottom: 0.75rem; margin-top: 1rem;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"  stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
                    </div>
                    <h3 style="color: white; font-size: 1.25rem; font-weight: 700; text-align: center; margin: 0;">Card 1</h3>
                    <p style="color: rgba(255,255,255,0.8); text-align: center; font-size: 0.875rem; margin-top: 0.5rem;">Stretches vertically</p>
                </div>

                <!-- Card 2 -->
                <div style="flex: 1 1 0%; display: flex; flex-direction: column; align-items: center; padding: 1rem; border-radius: 0.75rem; box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); border: 1px solid rgba(0,0,0,0.05); background-color: #e11d48; transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.02)'" onmouseout="this.style.transform='scale(1)'">
                    <div style="background-color: rgba(255,255,255,0.2); padding: 0.75rem; border-radius: 9999px; margin-bottom: 0.75rem; margin-top: 1rem;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>
                    </div>
                    <h3 style="color: white; font-size: 1.25rem; font-weight: 700; text-align: center; margin: 0;">Card 2</h3>
                    <p style="color: rgba(255,255,255,0.8); text-align: center; font-size: 0.875rem; margin-top: 0.5rem;">Stretches vertically</p>
                </div>

                <!-- Card 3 -->
                <div style="flex: 1 1 0%; display: flex; flex-direction: column; align-items: center; padding: 1rem; border-radius: 0.75rem; box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); border: 1px solid rgba(0,0,0,0.05); background-color: #be123c; transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.02)'" onmouseout="this.style.transform='scale(1)'">
                    <div style="background-color: rgba(255,255,255,0.2); padding: 0.75rem; border-radius: 9999px; margin-bottom: 0.75rem; margin-top: 1rem;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg>
                    </div>
                    <h3 style="color: white; font-size: 1.25rem; font-weight: 700; text-align: center; margin: 0;">Card 3</h3>
                    <p style="color: rgba(255,255,255,0.8); text-align: center; font-size: 0.875rem; margin-top: 0.5rem;">Stretches vertically</p>
                </div>

            </div>

        </div>

        <!-- === RIGHT GROUP (Contact Form) === -->
        <div style="width: 50%; height: 80vh; background-color: #2563eb; color: white; border-radius: 1rem; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04); overflow: hidden; display: flex; flex-direction: column;">
            
            <div style="padding: 2rem; padding-bottom: 1rem;">
                <h2 style="font-size: 1.875rem; font-weight: 700; margin-bottom: 0.5rem; margin-top: 0;">Contact Us</h2>
                <p style="color: #dbeafe; margin: 0;">We'll get back to you within 24 hours.</p>
            </div>

            <div class="custom-scrollbar" style="flex: 1 1 0%; background-color: rgba(255, 255, 255, 0.1); backdrop-filter: blur(4px); padding: 2rem; display: flex; flex-direction: column; gap: 1.25rem; overflow-y: auto;">
                
                <!-- Full Name -->
                <div>
                    <label style="display: block; font-size: 0.875rem; font-weight: 500; color: #dbeafe; margin-bottom: 0.25rem;">Full Name</label>
                    <div style="position: relative;">
                        <svg style="position: absolute; left: 0.75rem; top: 0.75rem; color: #bfdbfe;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        <input 
                            type="text" 
                            placeholder="John Doe" 
                            style="width: 100%; box-sizing: border-box; background-color: rgba(30, 64, 175, 0.5); border: 1px solid rgba(96, 165, 250, 0.3); border-radius: 0.5rem; padding-top: 0.625rem; padding-bottom: 0.625rem; padding-left: 2.5rem; padding-right: 1rem; color: white; outline: none; transition: box-shadow 0.2s;"
                            onfocus="this.style.boxShadow='0 0 0 2px #60a5fa'"
                            onblur="this.style.boxShadow='none'"
                        >
                    </div>
                </div>

                <!-- Email -->
                <div>
                    <label style="display: block; font-size: 0.875rem; font-weight: 500; color: #dbeafe; margin-bottom: 0.25rem;">Email Address</label>
                    <div style="position: relative;">
                        <svg style="position: absolute; left: 0.75rem; top: 0.75rem; color: #bfdbfe;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                        <input 
                            type="email" 
                            placeholder="john@example.com" 
                            style="width: 100%; box-sizing: border-box; background-color: rgba(30, 64, 175, 0.5); border: 1px solid rgba(96, 165, 250, 0.3); border-radius: 0.5rem; padding-top: 0.625rem; padding-bottom: 0.625rem; padding-left: 2.5rem; padding-right: 1rem; color: white; outline: none; transition: box-shadow 0.2s;"
                            onfocus="this.style.boxShadow='0 0 0 2px #60a5fa'"
                            onblur="this.style.boxShadow='none'"
                        >
                    </div>
                </div>

                <!-- Message -->
                <div style="flex: 1 1 0%; display: flex; flex-direction: column;">
                    <label style="display: block; font-size: 0.875rem; font-weight: 500; color: #dbeafe; margin-bottom: 0.25rem;">Message</label>
                    <div style="position: relative; flex: 1 1 0%;">
                        <svg style="position: absolute; left: 0.75rem; top: 0.75rem; color: #bfdbfe;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                        <textarea 
                            placeholder="How can we help you today?" 
                            style="width: 100%; height: 100%; min-height: 150px; box-sizing: border-box; background-color: rgba(30, 64, 175, 0.5); border: 1px solid rgba(96, 165, 250, 0.3); border-radius: 0.5rem; padding-top: 0.625rem; padding-bottom: 0.625rem; padding-left: 2.5rem; padding-right: 1rem; color: white; outline: none; resize: none; transition: box-shadow 0.2s;"
                            onfocus="this.style.boxShadow='0 0 0 2px #60a5fa'"
                            onblur="this.style.boxShadow='none'"
                        ></textarea>
                    </div>
                </div>

                <button 
                    style="width: 100%; background-color: white; color: #2563eb; font-weight: 700; padding-top: 0.75rem; padding-bottom: 0.75rem; border-radius: 0.5rem; border: none; cursor: pointer; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); margin-top: 0.5rem; transition: background-color 0.2s;"
                    onmouseover="this.style.backgroundColor='#eff6ff'"
                    onmouseout="this.style.backgroundColor='white'"
                >
                    Send Message
                </button>
            </div>
        </div>

    </div>
</body>
</html>
